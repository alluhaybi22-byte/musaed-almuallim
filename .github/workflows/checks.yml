name: App checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser regression suites
        shell: bash
        run: |
          failed=0
          for suite in classroom e2e review import drive listening reading single controls auto portable; do
            if ! npm run "test:$suite"; then
              failed=1
            fi
          done
          exit "$failed"
      - run: npm run build

      - name: Build independent desktop copy
        run: npm run build:portable
      - uses: actions/upload-artifact@v4
        with:
          name: Al-Musaed-Desktop-0.11
          path: dist/Al-Musaed-Desktop.html
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-evidence
          path: test-results/
          retention-days: 7
