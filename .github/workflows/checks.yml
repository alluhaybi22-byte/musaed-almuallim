name: App checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:review
      - run: npm run test:import
      - run: npm run test:drive
      - run: npm run test:listening
      - run: npm run test:reading
      - run: npm run test:single
      - run: npm run test:portable
      - run: npm run build

